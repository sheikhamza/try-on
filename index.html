<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Hamza Clothing - Virtual Try-On</title>


    <!-- =====================================================
         TAILWIND
    ====================================================== -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- =====================================================
         MEDIAPIPE POSE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

</head>


<style>

    * {
        box-sizing: border-box;
    }


    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, sans-serif;
    }


    body {
        background: #f8f8f8;
    }


    /* =====================================================
       MODAL
    ====================================================== */

    #tryOnModal {
        display: none;
    }


    #tryOnModal.active {
        display: flex;
    }


    /* =====================================================
       CAMERA STAGE
    ====================================================== */

    #stage {

        position: relative;

        width: min(100%, 430px);

        height: min(78vh, 700px);

        aspect-ratio: 3 / 4;

        overflow: hidden;

        background: #111;

        border-radius: 24px;

        margin: 0 auto;

        touch-action: none;

    }


    /* =====================================================
       VIDEO
    ====================================================== */

    #video {

        position: absolute;

        inset: 0;

        width: 100%;

        height: 100%;

        object-fit: cover;

        background: #111;

    }


    /* =====================================================
       GARMENTS
    ====================================================== */

    .garment {

        position: absolute;

        display: block;

        pointer-events: none;

        user-select: none;

        -webkit-user-drag: none;

        opacity: 0;

        z-index: 10;

        transform-origin: center center;

        will-change:
            left,
            top,
            width,
            height,
            transform,
            opacity;

        /*
            IMPORTANT:

            We use width + auto height.

            This keeps the original PNG
            aspect ratio and prevents
            clothes from becoming stretched.
        */

        height: auto;

    }


    #shirtGarment {
        z-index: 10;
    }


    #pantGarment {
        z-index: 11;
    }


    /* =====================================================
       LOADER
    ====================================================== */

    .loader {

        width: 42px;

        height: 42px;

        border: 4px solid rgba(255,255,255,.25);

        border-top-color: white;

        border-radius: 50%;

        animation: spin .8s linear infinite;

    }


    @keyframes spin {

        to {
            transform: rotate(360deg);
        }

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 640px) {

        #stage {

            width: 100%;

            height: calc(100dvh - 150px);

            max-height: 720px;

            border-radius: 20px;

        }

    }

</style>


<body class="bg-gray-50 text-gray-900">


<!-- =========================================================

<script>

/* =========================================================
   =========================================================
   1. PRODUCTS
   =========================================================
   
   ONLY ADD / EDIT PRODUCTS HERE.

   type:

   shirt
   pant
   full

   IMPORTANT:

   fit settings can be changed for each product
   without touching the main try-on code.

========================================================= */


const PRODUCTS = [

       SHIRT
    ====================================================== */

                */

                length: 1.35,


                /*
                   Shoulder/body rotation.
                */

                rotation: true

            }

        }

    },


    /* =====================================================
       T-SHIRT
    ====================================================== */

    {
        id: 2,

        name: "Classic T-Shirt",

        category: "T-Shirt",

        price: 1999,

        image: "t-s.png",

        tryOn: {

            type: "shirt",

            image: "t-s.png",

            fit: {

                width: 1.70,

                top: 0.15,

                length: 1.32,

                rotation: true

            }

        }

    },


    /* =====================================================
       GRAPHIC SHIRT
    ====================================================== */

    {
        id: 3,

        name: "Graphic T-Shirt",

        category: "T-Shirt",

        price: 1999,

        image: "g-1.png",

        tryOn: {

            type: "shirt",

            image: "g-1.png",

            fit: {

                width: 1.70,

                top: 0.15,

                length: 1.32,

                rotation: true

            }

        }

    },


    /* =====================================================
       PANT
    ====================================================== */

    {
        id: 4,

        name: "Classic Pant",

        category: "Pant",

        price: 2999,

        image: "pant.png",

        tryOn: {

            type: "pant",

            image: "pant.png",

            fit: {

                /*
                   Pant width.

                   Increase = wider.
                */

                width: 1.55,


                /*
                   Waist position.

                   Positive moves downward.
                   Negative moves upward.
                */

                top: -0.03,


                /*
                   Pant length.
                */

                length: 1.08,

                rotation: true

            }

        }

    },


    /* =====================================================
       PANT 2
    ====================================================== */

    {
        id: 5,

        name: "Black Pant",

        category: "Pant",

        price: 2999,

        image: "p-2.png",

        tryOn: {

            type: "pant",

            image: "p-2.png",

            fit: {

                width: 1.55,

                top: -0.03,

                length: 1.08,

                rotation: true

            }

        }

    },


    /* =====================================================
       PANT 3
    ====================================================== */

    {
        id: 6,

        name: "Blue Pant",

        category: "Pant",

        price: 2999,

        image: "p-3.png",

        tryOn: {

            type: "pant",

            image: "p-3.png",

            fit: {

                width: 1.55,

                top: -0.03,

                length: 1.08,

                rotation: true

            }

        }

    },


    /* =====================================================
       FULL OUTFIT
    ====================================================== */

    {
        id: 7,

        name: "Complete Outfit",

        category: "Full Outfit",

        price: 5498,

        image: "shirt.png",

        tryOn: {

            type: "full",

            shirt: "shirt.png",

            pant: "pant.png",


            shirtFit: {

                width: 1.70,

                top: 0.16,

                length: 1.35,

                rotation: true

            },


            pantFit: {

                width: 1.55,

                top: -0.03,

                length: 1.08,

                rotation: true

            }

        }

    }

];



/* =========================================================
   2. ELEMENTS
========================================================= */

const productGrid =
    document.getElementById("productGrid");


const modal =
    document.getElementById("tryOnModal");


const video =
    document.getElementById("video");


const stage =
    document.getElementById("stage");


const shirtGarment =
    document.getElementById("shirtGarment");


const pantGarment =
    document.getElementById("pantGarment");


const loading =
    document.getElementById("loading");


const loadingText =
    document.getElementById("loadingText");


const hint =
    document.getElementById("hint");


const trackingStatus =
    document.getElementById("trackingStatus");


const selectedProduct =
    document.getElementById("selectedProduct");



/* =========================================================
   3. STATE
========================================================= */

let currentTryOn = {

    type: null,

    shirt: null,

    pant: null,

    shirtFit: null,

    pantFit: null

};


let currentStream = null;


let facingMode = "user";


let cameraOpen = false;


let processingPose = false;


let animationFrame = null;


/*
   Previous positions.

   These are used for smoothing.
*/

let smooth = {

    shirtX: null,

    shirtY: null,

    shirtWidth: null,

    shirtAngle: null,

    pantX: null,

    pantY: null,

    pantWidth: null,

    pantAngle: null

};



/* =========================================================
   4. MEDIAPIPE
========================================================= */

const pose = new Pose({

    locateFile: function(file) {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

    }

});


pose.setOptions({

    modelComplexity: 1,

    smoothLandmarks: true,

    enableSegmentation: false,

    smoothSegmentation: false,

    minDetectionConfidence: 0.55,

    minTrackingConfidence: 0.55

});


pose.onResults(handlePoseResults);



/* =========================================================
   5. PRODUCT RENDER
========================================================= */

function renderProducts() {

    productGrid.innerHTML = "";

    PRODUCTS.forEach(product => {

        productGrid.appendChild(
            createProductCard(product)
        );

    });

}



/* =========================================================
   6. PRODUCT CARD
========================================================= */

function createProductCard(product) {

    const card =
        document.createElement("div");


    card.className =
        "bg-white rounded-3xl overflow-hidden border shadow-sm";


    card.innerHTML = `

        <div
            class="bg-gray-100 aspect-square flex items-center justify-center p-8"
        >

            <img
                src="${product.image}"
                alt="${product.name}"
                class="w-full h-full object-contain"
            >

        </div>


        <div class="p-5">

            <p
                class="text-xs uppercase tracking-widest text-gray-400 mb-2"
            >
                ${product.category}
            </p>


            <h3 class="text-xl font-bold">
                ${product.name}
            </h3>


            <p class="text-gray-500 mt-1 mb-5">
                Rs. ${formatPrice(product.price)}
            </p>


            <button
                class="try-on-button w-full bg-black text-white py-3.5 rounded-xl font-semibold hover:bg-gray-800 transition"
            >
                Try On
            </button>

        </div>

    `;


    card
        .querySelector(".try-on-button")
        .addEventListener("click", () => {

            openTryOn(product);

        });


    return card;

}



/* =========================================================
   7. PRICE
========================================================= */

function formatPrice(price) {

    return Number(price).toLocaleString("en-PK");

}



/* =========================================================
   8. OPEN TRY ON
========================================================= */

function openTryOn(product) {


    /*
       Reset smoothing.
    */

    resetSmoothing();


    /*
       Build current try-on state.
    */

    if (product.tryOn.type === "full") {

        currentTryOn = {

            type: "full",

            shirt: product.tryOn.shirt,

            pant: product.tryOn.pant,

            shirtFit:
                product.tryOn.shirtFit ||
                getDefaultShirtFit(),

            pantFit:
                product.tryOn.pantFit ||
                getDefaultPantFit()

        };

    }

    else if (product.tryOn.type === "shirt") {

        currentTryOn = {

            type: "shirt",

            shirt: product.tryOn.image,

            pant: null,

            shirtFit:
                product.tryOn.fit ||
                getDefaultShirtFit(),

            pantFit: null

        };

    }

    else if (product.tryOn.type === "pant") {

        currentTryOn = {

            type: "pant",

            shirt: null,

            pant: product.tryOn.image,

            shirtFit: null,

            pantFit:
                product.tryOn.fit ||
                getDefaultPantFit()

        };

    }


    selectedProduct.textContent =
        product.name;


    hideGarments();


    /*
       Set images.
    */

    if (currentTryOn.shirt) {

        shirtGarment.src =
            currentTryOn.shirt;

    }


    if (currentTryOn.pant) {

        pantGarment.src =
            currentTryOn.pant;

    }


    modal.classList.add("active");


    document.body.style.overflow =
        "hidden";


    startCamera();

}



/* =========================================================
   9. DEFAULT FIT SETTINGS
========================================================= */

function getDefaultShirtFit() {

    return {

        width: 1.70,

        top: 0.16,

        length: 1.35,

        rotation: true

    };

}


function getDefaultPantFit() {

    return {

        width: 1.55,

        top: -0.03,

        length: 1.08,

        rotation: true

    };

}



/* =========================================================
   10. CLOSE
========================================================= */

function closeTryOn() {

    modal.classList.remove("active");


    document.body.style.overflow = "";


    stopCamera();


    hideGarments();


    resetSmoothing();

}



/* =========================================================
   11. STOP CAMERA
========================================================= */

function stopCamera() {

    cameraOpen = false;


    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    if (currentStream) {

        currentStream
            .getTracks()
            .forEach(track => {

                track.stop();

            });

        currentStream = null;

    }


    video.pause();


    video.srcObject = null;

}



/* =========================================================
   12. START CAMERA
========================================================= */

async function startCamera() {

    try {

        loading.classList.remove("hidden");

        loadingText.textContent =
            "Opening camera...";


        /*
           Stop old stream first.
        */

        stopCamera();


        /*
           Mobile camera settings.

           We prefer 720p portrait.
        */

        const constraints = {

            audio: false,

            video: {

                facingMode: {
                    ideal: facingMode
                },

                width: {
                    ideal: 720
                },

                height: {
                    ideal: 960
                }
            }

        };


        currentStream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );


        video.srcObject =
            currentStream;


        /*
           Mirror only front camera.
        */

        if (facingMode === "user") {

            video.style.transform =
                "scaleX(-1)";

        }

        else {

            video.style.transform =
                "scaleX(1)";

        }


        await video.play();


        cameraOpen = true;


        loading.classList.add("hidden");


        trackingStatus.textContent =
            "Looking for you...";


        /*
           Start pose processing.
        */

        processCameraFrame();


    }

    catch(error) {

        console.error(
            "Camera Error:",
            error
        );


        loadingText.textContent =
            "Camera permission required";


        trackingStatus.textContent =
            "Camera error";

    }

}



/* =========================================================
   13. PROCESS CAMERA
========================================================= */

async function processCameraFrame() {

    if (!cameraOpen) {
        return;
    }


    /*
       Prevent overlapping MediaPipe requests.
    */

    if (
        !processingPose &&
        video.readyState >= 2
    ) {

        processingPose = true;


        try {

            await pose.send({

                image: video

            });

        }

        catch(error) {

            console.warn(
                "Pose error:",
                error
            );

        }


        processingPose = false;

    }


    animationFrame =
        requestAnimationFrame(
            processCameraFrame
        );

}



/* =========================================================
   14. SWITCH CAMERA
========================================================= */

async function switchCamera() {

    facingMode =
        facingMode === "user"
            ? "environment"
            : "user";


    resetSmoothing();


    await startCamera();

}



/* =========================================================
   15. HIDE GARMENTS
========================================================= */

function hideGarments() {

    shirtGarment.style.opacity = "0";

    pantGarment.style.opacity = "0";

}



/* =========================================================
   16. RESET SMOOTHING
========================================================= */

function resetSmoothing() {

    smooth = {

        shirtX: null,

        shirtY: null,

        shirtWidth: null,

        shirtAngle: null,

        pantX: null,

        pantY: null,

        pantWidth: null,

        pantAngle: null

    };

}



/* =========================================================
   17. DISTANCE
========================================================= */

function distance(a, b) {

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}



/* =========================================================
   18. MIDPOINT
========================================================= */

function midpoint(a, b) {

    return {

        x:
            (a.x + b.x) / 2,

        y:
            (a.y + b.y) / 2

    };

}



/* =========================================================
   19. LERP
========================================================= */

function lerp(
    oldValue,
    newValue,
    amount = 0.35
) {

    if (
        oldValue === null ||
        oldValue === undefined
    ) {

        return newValue;

    }


    return (
        oldValue +
        (newValue - oldValue) *
        amount
    );

}



/* =========================================================
   20. VISIBILITY CHECK
========================================================= */

function visible(point, minimum = 0.25) {

    return (
        point &&
        (point.visibility || 0) >= minimum
    );

}



/* =========================================================
   21. VIDEO → STAGE COORDINATE SYSTEM
=========================================================

   THIS IS VERY IMPORTANT.

   Because the video uses:

       object-fit: cover

   the video may be cropped on mobile.

   MediaPipe coordinates are based on the
   original camera image.

   This function converts those coordinates
   into the actual visible stage coordinates.

========================================================= */

function landmarkToStage(point) {

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    const stageWidth =
        stage.clientWidth;

    const stageHeight =
        stage.clientHeight;


    if (
        !videoWidth ||
        !videoHeight ||
        !stageWidth ||
        !stageHeight
    ) {

        return {
            x: 0,
            y: 0
        };

    }


    /*
       object-fit: cover

       Find scale required to cover
       entire stage.
    */

    const scale =
        Math.max(

            stageWidth / videoWidth,

            stageHeight / videoHeight

        );


    const displayedWidth =
        videoWidth * scale;


    const displayedHeight =
        videoHeight * scale;


    /*
       Cropped area.
    */

    const cropX =
        (displayedWidth - stageWidth) / 2;


    const cropY =
        (displayedHeight - stageHeight) / 2;


    /*
       Convert normalized MediaPipe
       coordinate to displayed coordinate.
    */

    let x =
        point.x * displayedWidth -
        cropX;


    let y =
        point.y * displayedHeight -
        cropY;


    /*
       Mirror X for front camera.

       The video itself is mirrored.
    */

    if (facingMode === "user") {

        x =
            stageWidth - x;

    }


    return {

        x: x,

        y: y

    };

}



/* =========================================================
   22. HANDLE POSE RESULTS
========================================================= */

function handlePoseResults(results) {


    if (
        !results.poseLandmarks ||
        !video.videoWidth
    ) {

        hideGarments();


        showHint(
            "Stand in front of the camera"
        );


        return;

    }


    const l =
        results.poseLandmarks;


    /*
       MediaPipe body points.

       11 = Left Shoulder
       12 = Right Shoulder

       23 = Left Hip
       24 = Right Hip

       25 = Left Knee
       26 = Right Knee

       27 = Left Ankle
       28 = Right Ankle
    */


    const leftShoulder =
        l[11];


    const rightShoulder =
        l[12];


    const leftHip =
        l[23];


    const rightHip =
        l[24];


    const leftKnee =
        l[25];


    const rightKnee =
        l[26];


    const leftAnkle =
        l[27];


    const rightAnkle =
        l[28];


    /*
       Basic shoulder check.
    */

    if (
        !visible(leftShoulder, 0.45) ||
        !visible(rightShoulder, 0.45)
    ) {

        hideGarments();

        showHint(
            "Show both shoulders"
        );

        return;

    }


    /*
       Convert everything to actual
       visible stage coordinates.
    */

    const LS =
        landmarkToStage(
            leftShoulder
        );


    const RS =
        landmarkToStage(
            rightShoulder
        );


    const shoulderMid =
        midpoint(
            LS,
            RS
        );


    const shoulderWidth =
        distance(
            LS,
            RS
        );


    /*
       Hips.
    */

    let hipMid = null;

    let hipWidth = 0;


    if (
        visible(leftHip, 0.25) &&
        visible(rightHip, 0.25)
    ) {

        const LH =
            landmarkToStage(
                leftHip
            );


        const RH =
            landmarkToStage(
                rightHip
            );


        hipMid =
            midpoint(
                LH,
                RH
            );


        hipWidth =
            distance(
                LH,
                RH
            );

    }


    /*
       Knees.
    */

    let kneeMid = null;

    let kneeWidth = 0;


    if (
        visible(leftKnee, 0.20) &&
        visible(rightKnee, 0.20)
    ) {

        const LK =
            landmarkToStage(
                leftKnee
            );


        const RK =
            landmarkToStage(
                rightKnee
            );


        kneeMid =
            midpoint(
                LK,
                RK
            );


        kneeWidth =
            distance(
                LK,
                RK
            );

    }


    /*
       Ankles.
    */

    let ankleMid = null;


    if (
        visible(leftAnkle, 0.15) &&
        visible(rightAnkle, 0.15)
    ) {

        const LA =
            landmarkToStage(
                leftAnkle
            );


        const RA =
            landmarkToStage(
                rightAnkle
            );


        ankleMid =
            midpoint(
                LA,
                RA
            );

    }


    /*
       Body must be reasonably visible.
    */

    if (
        currentTryOn.type === "pant" ||
        currentTryOn.type === "full"
    ) {

        if (
            !hipMid ||
            hipWidth < 20
        ) {

            hideGarments();

            showHint(
                "Move slightly back so your waist is visible"
            );

            return;

        }

    }


    /*
       Hide hint.
    */

    hint.classList.add("hidden");


    trackingStatus.textContent =
        "Tracking ✓";


    /*
       SHIRT
    */

    if (
        currentTryOn.type === "shirt" ||
        currentTryOn.type === "full"
    ) {

        updateShirt(

            shoulderMid,

            shoulderWidth,

            hipMid,

            hipWidth,

            currentTryOn.shirtFit

        );

    }

    else {

        shirtGarment.style.opacity =
            "0";

    }


    /*
       PANT
    */

    if (
        currentTryOn.type === "pant" ||
        currentTryOn.type === "full"
    ) {

        updatePant(

            hipMid,

            hipWidth,

            kneeMid,

            kneeWidth,

            ankleMid,

            currentTryOn.pantFit

        );

    }

    else {

        pantGarment.style.opacity =
            "0";

    }

}



/* =========================================================
   23. UPDATE SHIRT
========================================================= */

function updateShirt(

    shoulderMid,

    shoulderWidth,

    hipMid,

    hipWidth,

    fit

) {

    if (!fit) {

        fit =
            getDefaultShirtFit();

    }


    /*
       BODY BASED WIDTH

       Instead of fixed stage size,
       shirt is based on actual shoulder width.

       This means:

       User comes closer
       → shoulders become bigger
       → shirt becomes bigger

       User moves away
       → shoulders become smaller
       → shirt becomes smaller
    */

    let shirtWidth =
        shoulderWidth *
        fit.width;


    /*
       Minimum size.

       This prevents tiny garments
       when user is far away.
    */

    const minWidth =
        Math.max(
            120,
            stage.clientWidth * 0.20
        );


    shirtWidth =
        Math.max(
            shirtWidth,
            minWidth
        );


    /*
       Don't allow garment to become
       wider than almost the complete stage.
    */

    shirtWidth =
        Math.min(
            shirtWidth,
            stage.clientWidth * 1.10
        );


    /*
       TOP POSITION

       Shoulder -> hip distance gives
       actual torso size.

       If hips exist, use torso height.
    */

    let torsoHeight;


    if (
        hipMid &&
        hipMid.y > shoulderMid.y
    ) {

        torsoHeight =
            hipMid.y -
            shoulderMid.y;

    }

    else {

        torsoHeight =
            shirtWidth * 0.80;

    }


    /*
       Shirt top.

       fit.top controls how much
       it starts above shoulders.

       Example:

       0.16 = normal
       0.20 = slightly higher
       0.10 = slightly lower
    */

    const topOffset =
        shirtWidth *
        fit.top;


    let shirtTop =
        shoulderMid.y -
        topOffset;


    /*
       Shirt rotation.

       Calculate angle of shoulders.

       This helps when user tilts body.
    */

    let angle = 0;


    if (fit.rotation) {

        angle =
            Math.atan2(

                (
                    RS_Y_PLACEHOLDER -
                    RS_Y_PLACEHOLDER
                ),

                1

            );

    }


    /*
       We calculate rotation directly
       from the original shoulder points
       using helper below.
    */

    /*
       The shirt's width is already based
       on shoulder width.

       Height stays proportional to PNG.
    */


    smooth.shirtX =
        lerp(
            smooth.shirtX,
            shoulderMid.x,
            0.30
        );


    smooth.shirtY =
        lerp(
            smooth.shirtY,
            shirtTop,
            0.30
        );


    smooth.shirtWidth =
        lerp(
            smooth.shirtWidth,
            shirtWidth,
            0.30
        );


    /*
       Use a very small rotation
       based on body orientation.

       We intentionally keep it limited
       so the garment doesn't jump.
    */

    let shirtAngle = 0;


    /*
       We calculate angle using shoulders
       from current stored positions.

       For a mirrored camera, this remains
       visually correct.
    */

    if (
        window.currentShoulderLeft &&
        window.currentShoulderRight &&
        fit.rotation
    ) {

        const a =
            window.currentShoulderLeft;


        const b =
            window.currentShoulderRight;


        shirtAngle =
            Math.atan2(
                b.y - a.y,
                b.x - a.x
            ) * 180 / Math.PI;


        /*
           Keep rotation sensible.
        */

        shirtAngle =
            Math.max(
                -20,
                Math.min(
                    20,
                    shirtAngle
                )
            );

    }


    smooth.shirtAngle =
        lerp(
            smooth.shirtAngle,
            shirtAngle,
            0.25
        );


    /*
       APPLY
    */

    shirtGarment.style.left =
        `${smooth.shirtX}px`;


    shirtGarment.style.top =
        `${smooth.shirtY}px`;


    shirtGarment.style.width =
        `${smooth.shirtWidth}px`;


    shirtGarment.style.height =
        "auto";


    shirtGarment.style.transform =
        `translateX(-50%) rotate(${smooth.shirtAngle}deg)`;


    shirtGarment.style.opacity =
        "0.96";

}



/* =========================================================
   24. UPDATE PANT
========================================================= */

function updatePant(

    hipMid,

    hipWidth,

    kneeMid,

    kneeWidth,

    ankleMid,

    fit

) {

    if (
        !hipMid ||
        hipWidth <= 0
    ) {

        pantGarment.style.opacity =
            "0";

        return;

    }


    if (!fit) {

        fit =
            getDefaultPantFit();

    }


    /*
       PANT WIDTH

       Based directly on actual hip width.

       This fixes the main problem
       where pants didn't scale properly.
    */

    let pantWidth =
        hipWidth *
        fit.width;


    /*
       Minimum width.
    */

    pantWidth =
        Math.max(
            pantWidth,
            stage.clientWidth * 0.20
        );


    /*
       Maximum width.

       Allow it to become larger than
       old 95% clamp.
    */

    pantWidth =
        Math.min(
            pantWidth,
            stage.clientWidth * 1.10
        );


    /*
       PANT LENGTH

       We don't force a separate height
       because that would stretch PNG.

       Instead, width is used and the
       original PNG aspect ratio is preserved.

       For extra long pants, increase
       fit.width slightly if the PNG
       itself has correct proportions.
    */


    /*
       Waist position.
    */

    const topOffset =
        pantWidth *
        fit.top;


    let pantTop =
        hipMid.y +
        topOffset;


    /*
       Rotation.

       Get current hip orientation.
    */

    let pantAngle = 0;


    if (
        window.currentHipLeft &&
        window.currentHipRight &&
        fit.rotation
    ) {

        const a =
            window.currentHipLeft;


        const b =
            window.currentHipRight;


        pantAngle =
            Math.atan2(
                b.y - a.y,
                b.x - a.x
            ) * 180 / Math.PI;


        pantAngle =
            Math.max(
                -15,
                Math.min(
                    15,
                    pantAngle
                )
            );

    }


    /*
       Smooth position.
    */

    smooth.pantX =
        lerp(
            smooth.pantX,
            hipMid.x,
            0.30
        );


    smooth.pantY =
        lerp(
            smooth.pantY,
            pantTop,
            0.30
        );


    smooth.pantWidth =
        lerp(
            smooth.pantWidth,
            pantWidth,
            0.30
        );


    smooth.pantAngle =
        lerp(
            smooth.pantAngle,
            pantAngle,
            0.25
        );


    /*
       APPLY
    */

    pantGarment.style.left =
        `${smooth.pantX}px`;


    pantGarment.style.top =
        `${smooth.pantY}px`;


    pantGarment.style.width =
        `${smooth.pantWidth}px`;


    pantGarment.style.height =
        "auto";


    pantGarment.style.transform =
        `translateX(-50%) rotate(${smooth.pantAngle}deg)`;


    pantGarment.style.opacity =
        "0.96";

}



/* =========================================================
   25. SHOW HINT
========================================================= */

function showHint(message) {

    hint.classList.remove(
        "hidden"
    );


    hint.textContent =
        message;


    trackingStatus.textContent =
        "Looking for you...";

}



/* =========================================================
   26. STORE CURRENT LANDMARKS
=========================================================

   We store shoulder/hip positions
   separately because shirt/pant rotation
   uses them.
========================================================= */

const originalHandlePoseResults =
    handlePoseResults;



/*
   We don't need to modify MediaPipe.

   Instead, these values are updated
   inside a small wrapper.
*/


pose.onResults(function(results) {

    if (
        results.poseLandmarks
    ) {

        const l =
            results.poseLandmarks;


        if (
            visible(l[11], 0.25) &&
            visible(l[12], 0.25)
        ) {

            window.currentShoulderLeft =
                landmarkToStage(l[11]);


            window.currentShoulderRight =
                landmarkToStage(l[12]);

        }


        if (
            visible(l[23], 0.20) &&
            visible(l[24], 0.20)
        ) {

            window.currentHipLeft =
                landmarkToStage(l[23]);


            window.currentHipRight =
                landmarkToStage(l[24]);

        }

    }


    /*
       Run actual handler.
    */

    originalHandlePoseResults(
        results
    );

});



/* =========================================================
   27. ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeTryOn();

        }

    }
);



/* =========================================================
   28. BACKGROUND CLICK
========================================================= */

modal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === modal
        ) {

            closeTryOn();

        }

    }
);



/* =========================================================
   29. INITIALIZE
========================================================= */

renderProducts();

(() => {

    // Right Click Disable
    document.addEventListener("contextmenu", e => e.preventDefault());

    // Keyboard Shortcuts Disable
    document.addEventListener("keydown", e => {

        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && ["U"].includes(e.key.toUpperCase()))
        ) {
            e.preventDefault();
            return false;
        }

    });

    // Drag Disable
    document.addEventListener("dragstart", e => e.preventDefault());
    setInterval(() => {

        const w = window.outerWidth - window.innerWidth > 160;
        const h = window.outerHeight - window.innerHeight > 160;

        if (w || h) {

            if (!document.querySelector("#shield")) {

                const x = document.createElement("div");

                x.id = "shield";

                x.style.cssText = `
                    position:fixed;
                    inset:0;
                    background:#111;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    z-index:999999;
                    font-size:40px;
                    color:#fff;
                    backdrop-filter:blur(20px);
                `;

                x.innerHTML = "Inspection Disabled";

                document.body.appendChild(x);

                document.body.style.filter = "blur(20px)";
            }

        }

    }, 1000);

    console.clear();

    Object.defineProperty(window, "console", {
        value: {
            log() {},
            warn() {},
            error() {},
            info() {},
            clear() {}
        }
    });

})();

</script>
