<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Hamza Clothing - Virtual Try-On</title>


    <!-- =====================================================
         TAILWIND
    ====================================================== -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- =====================================================
         MEDIAPIPE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: Arial, sans-serif;
        }


        button {
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           TRY ON MODAL
        ====================================================== */

        #tryOnModal {
            display: none;
        }


        #tryOnModal.active {
            display: flex;
        }


        /* =====================================================
           CAMERA STAGE
        ====================================================== */

        #stage {

            position: relative;

            width: 100%;

            max-width: 430px;

            /*
                Taller frame on mobile.

                This allows more of the body
                to be visible while standing
                closer to the phone.
            */

            aspect-ratio: 9 / 16;

            max-height: calc(100dvh - 155px);

            overflow: hidden;

            background: #111;

            border-radius: 28px;

        }


        /* =====================================================
           CAMERA
        ====================================================== */

        #video {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            /*
                Don't crop the camera as aggressively
                as object-fit: cover.
            */

            object-fit: fill;

            /*
                Selfie camera mirror
            */

            transform: scaleX(-1);

        }


        /* =====================================================
           GARMENTS
        ====================================================== */

        .garment {

            position: absolute;

            left: 50%;

            top: 0;

            width: 0;

            height: auto;

            opacity: 0;

            pointer-events: none;

            user-select: none;

            -webkit-user-drag: none;

            transform: translateX(-50%);

            transform-origin: center center;

            will-change:
                left,
                top,
                width,
                height,
                opacity,
                transform;

        }


        #shirtGarment {
            z-index: 10;
        }


        #pantGarment {
            z-index: 11;
        }


        /* =====================================================
           LOADER
        ====================================================== */

        .loader {

            width: 40px;

            height: 40px;

            border:
                4px solid
                rgba(255,255,255,.2);

            border-top-color:
                white;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 640px) {

            #tryOnModal {
                padding:
                    max(10px, env(safe-area-inset-top))
                    10px
                    max(10px, env(safe-area-inset-bottom))
                    10px;
            }


            #stage {

                width: min(
                    100%,
                    430px
                );

                /*
                    Use almost the complete
                    available mobile height.
                */

                max-height:
                    calc(100dvh - 145px);

                border-radius: 22px;

            }

        }


        /* =====================================================
           SMALL PHONES
        ====================================================== */

        @media (max-height: 700px) {

            #stage {

                max-height:
                    calc(100dvh - 125px);

            }

        }

    </style>

</head>


<body class="bg-gray-50 text-gray-900">


<!-- =========================================================
     HEADER
========================================================= -->

<header
    class="bg-white border-b sticky top-0 z-40"
>

    <div

    >

        <h1 class="text-2xl font-bold">
            Hamza Clothing
        </h1>


        <div class="text-sm text-gray-500">

        </div>

    </div>

</header>



<!-- =========================================================
     MAIN STORE
========================================================= -->

<main class="max-w-6xl mx-auto px-5 py-10">


    <!-- HERO -->

    <section class="mb-10">

        <p class="text-sm text-gray-500 mb-2">

        </p>


        <h2 class="text-4xl md:text-5xl font-bold mb-4">

        </h2>


        <p class="text-gray-500 max-w-xl">

    <!-- PRODUCT GRID -->

    <section>

        </div>

</main>



<!-- =========================================================
     TRY ON MODAL
========================================================= -->

<div
    id="tryOnModal"
    class="fixed inset-0 z-[100] bg-black/90 items-center justify-center p-3 sm:p-4"
>


    <div class="w-full max-w-md">


        <!-- MODAL HEADER -->

        <div
            class="flex items-center justify-between text-white mb-3"
        >

            <div>

                <p
                    class="text-xs text-white/50 uppercase tracking-widest"
                >
                    Virtual Try-On
                </p>


                <h3
                    id="selectedProduct"
                    class="text-xl font-bold"
                >
                    Product
                </h3>

            </div>


            <button
                id="closeButton"
                class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 transition"
            >
                ✕
            </button>

        </div>



        <!-- =================================================
             CAMERA STAGE
        ================================================== -->

        <div id="stage">


            <!-- CAMERA -->

            <video
                id="video"
                autoplay
                playsinline
                muted
            ></video>



            <!-- LOADING -->

            <div
                id="loading"
                class="absolute inset-0 z-30 flex items-center justify-center bg-black/60"
            >

                <div
                    class="text-center text-white px-5"
                >

                    <div
                        class="loader mx-auto mb-4"
                    ></div>


                    <p
                        id="loadingText"

                        Starting camera...
                    </p>


                    <p

                    >

                    </p>

                </div>

            </div>



            <!-- HINT -->

            <div

            <!-- PANT -->

            <!-- STATUS -->

            <div

            >

        </div>



        <!-- =================================================
             CONTROLS
        ================================================== -->

        <div
            class="grid grid-cols-2 gap-3 mt-3"
        >

            <button
                id="switchCameraButton"
                class="bg-white/10 border border-white/10 text-white py-3.5 rounded-xl font-semibold hover:bg-white/20 transition"
            >
                Switch Camera
            </button>


            <button
                id="backButton"
                class="bg-white text-black py-3.5 rounded-xl font-semibold hover:bg-gray-200 transition"
            >
                Back To Shop
            </button>

        </div>

    </div>

</div>



<script>

/* =========================================================
   1. PRODUCT DATA
=========================================================

   ADD PRODUCTS HERE.

   type:

   shirt
   pant
   full

========================================================= */


const PRODUCTS = [

    {
        id: 1,

        name: "Classic Shirt",

        category: "Shirt",

        price: 2499,

        image: "shirt.png",

        tryOn: {

            type: "shirt",

            image: "shirt.png",

            /*
                Increase/decrease this
                if shirt size needs adjustment.
            */

            scale: 2.15

        }

    },


    {
        id: 2,

        name: "Classic T-Shirt",

        category: "T-Shirt",

        price: 1999,

        image: "t-s.png",

        tryOn: {

            type: "shirt",

            image: "t-s.png",

            scale: 2.15

        }

    },


    {
        id: 3,

        name: "Classic Green Shirt",

        category: "Shirt",

        price: 1999,

        image: "g-1.png",

        tryOn: {

            type: "shirt",

            image: "g-1.png",

            scale: 2.15

        }

    },


    {
        id: 4,

        name: "Classic Pant",

        category: "Pant",

        price: 2999,

        image: "pant.png",

        tryOn: {

            type: "pant",

            image: "pant.png",

            scale: 2.80

        }

    },


    {
        id: 5,

        name: "Classic Pant 2",

        category: "Pant",

        price: 2999,

        image: "p-2.png",

        tryOn: {

            type: "pant",

            image: "p-2.png",

            scale: 2.80

        }

    },


    {
        id: 6,

        name: "Classic Pant 3",

        category: "Pant",

        price: 2999,

        image: "p-3.png",

        tryOn: {

            type: "pant",

            image: "p-3.png",

            scale: 2.80

        }

    },


    {
        id: 7,

        name: "Complete Outfit",

        category: "Full Outfit",

        price: 5498,

        image: "shirt.png",

        tryOn: {

            type: "full",

            shirt: "shirt.png",

            pant: "pant.png",

            shirtScale: 2.15,

            pantScale: 2.80

        }

    }

];



/* =========================================================
   2. ELEMENTS
========================================================= */


const productGrid =
    document.getElementById("productGrid");


const modal =
    document.getElementById("tryOnModal");


const video =
    document.getElementById("video");


const stage =
    document.getElementById("stage");


const shirtGarment =
    document.getElementById("shirtGarment");


const pantGarment =
    document.getElementById("pantGarment");


const loading =
    document.getElementById("loading");


const loadingText =
    document.getElementById("loadingText");


const hint =
    document.getElementById("hint");


const trackingStatus =
    document.getElementById("trackingStatus");


const selectedProduct =
    document.getElementById("selectedProduct");


const closeButton =
    document.getElementById("closeButton");


const backButton =
    document.getElementById("backButton");


const switchCameraButton =
    document.getElementById("switchCameraButton");



/* =========================================================
   3. STATE
========================================================= */


let currentTryOn = {

    type: null,

    shirt: null,

    pant: null,

    shirtScale: 2.15,

    pantScale: 2.80

};


let facingMode = "user";


let mediaStream = null;


let cameraRunning = false;


let processingPose = false;


let lastPoseTime = 0;


/*
    Process approximately 20-24 FPS.

    This helps mobile performance.
*/

const POSE_INTERVAL = 45;



/* =========================================================
   4. RENDER PRODUCTS
========================================================= */


function renderProducts() {

    productGrid.innerHTML = "";


    PRODUCTS.forEach(product => {

        productGrid.appendChild(
            createProductCard(product)
        );

    });

}



/* =========================================================
   5. CREATE PRODUCT CARD
========================================================= */


function createProductCard(product) {

    const card =
        document.createElement("div");


    card.className =
        "bg-white rounded-3xl overflow-hidden border shadow-sm";


    card.innerHTML = `

        <div
            class="bg-gray-100 aspect-square flex items-center justify-center p-8"
        >

            <img
                src="${product.image}"
                alt="${product.name}"
                class="w-full h-full object-contain"
            >

        </div>


        <div class="p-5">

            <p
                class="text-xs uppercase tracking-widest text-gray-400 mb-2"
            >
                ${product.category}
            </p>


            <h3
                class="text-xl font-bold"
            >
                ${product.name}
            </h3>


            <p
                class="text-gray-500 mt-1 mb-5"
            >
                Rs. ${formatPrice(product.price)}
            </p>


            <button
                class="try-on-button w-full bg-black text-white py-3.5 rounded-xl font-semibold hover:bg-gray-800 transition"
            >
                Try On
            </button>

        </div>

    `;


    const button =
        card.querySelector(".try-on-button");


    button.addEventListener(
        "click",
        () => openTryOn(product)
    );


    return card;

}



/* =========================================================
   6. PRICE
========================================================= */


function formatPrice(price) {

    return price.toLocaleString("en-PK");

}



/* =========================================================
   7. OPEN TRY ON
========================================================= */


function openTryOn(product) {


    currentTryOn = {

        type: product.tryOn.type,

        shirt:
            product.tryOn.shirt ||
            product.tryOn.image ||
            null,

        pant:
            product.tryOn.pant ||
            null,

        shirtScale:
            product.tryOn.shirtScale ||
            product.tryOn.scale ||
            2.15,

        pantScale:
            product.tryOn.pantScale ||
            product.tryOn.scale ||
            2.80

    };


    selectedProduct.textContent =
        product.name;


    hideGarments();


    shirtGarment.src =
        currentTryOn.shirt || "";


    pantGarment.src =
        currentTryOn.pant || "";


    modal.classList.add("active");


    document.body.style.overflow =
        "hidden";


    loading.classList.remove("hidden");


    loadingText.textContent =
        "Opening camera...";


    startCamera();

}



/* =========================================================
   8. CLOSE TRY ON
========================================================= */


function closeTryOn() {

    modal.classList.remove("active");


    document.body.style.overflow =
        "";


    stopCamera();


    hideGarments();


    hint.classList.add("hidden");


    trackingStatus.textContent =
        "Looking for you...";

}



/* =========================================================
   9. STOP CAMERA
========================================================= */


function stopCamera() {

    cameraRunning = false;


    processingPose = false;


    if (mediaStream) {

        mediaStream
            .getTracks()
            .forEach(track => track.stop());

        mediaStream = null;

    }


    video.srcObject = null;

}



/* =========================================================
   10. HIDE GARMENTS
========================================================= */


function hideGarments() {

    shirtGarment.style.opacity =
        "0";


    pantGarment.style.opacity =
        "0";

}



/* =========================================================
   11. MEDIAPIPE POSE
========================================================= */


const pose =
    new Pose({

        locateFile: function(file) {

            return `
                https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}
            `;

        }

    });


/*
    Model complexity 0 is much lighter
    for mobile devices.
*/

pose.setOptions({

    modelComplexity: 0,

    smoothLandmarks: true,

    enableSegmentation: false,

    smoothSegmentation: false,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


pose.onResults(
    handlePoseResults
);



/* =========================================================
   12. START CAMERA
========================================================= */


async function startCamera() {

    try {

        loading.classList.remove("hidden");


        loadingText.textContent =
            "Opening camera...";


        stopCamera();


        /*
            Make sure browser supports camera.
        */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Camera API not supported"
            );

        }


        /*
            Ask for portrait-friendly camera.

            facingMode:
            user = front camera
            environment = back camera
        */

        const constraints = {

            audio: false,

            video: {

                facingMode: {
                    ideal: facingMode
                },

                width: {
                    ideal: 720
                },

                height: {
                    ideal: 1280
                },

                aspectRatio: {
                    ideal: 9 / 16
                }

            }

        };


        mediaStream =
            await navigator.mediaDevices
                .getUserMedia(constraints);


        video.srcObject =
            mediaStream;


        video.setAttribute(
            "playsinline",
            "true"
        );


        video.setAttribute(
            "muted",
            "true"
        );


        /*
            Mirror only front camera.
        */

        if (
            facingMode === "user"
        ) {

            video.style.transform =
                "scaleX(-1)";

        }
        else {

            video.style.transform =
                "scaleX(1)";

        }


        await video.play();


        cameraRunning = true;


        loading.classList.add(
            "hidden"
        );


        trackingStatus.textContent =
            "Looking for you...";


        /*
            Start pose loop.
        */

        requestAnimationFrame(
            processCameraFrame
        );

    }


    catch(error) {

        console.error(
            "Camera Error:",
            error
        );


        loading.classList.remove(
            "hidden"
        );


        loadingText.textContent =
            getCameraErrorMessage(error);


        trackingStatus.textContent =
            "Camera unavailable";

    }

}



/* =========================================================
   13. CAMERA ERROR MESSAGE
========================================================= */


function getCameraErrorMessage(error) {

    if (!error) {

        return "Unable to open camera.";

    }


    if (
        error.name ===
        "NotAllowedError"
    ) {

        return "Please allow camera permission.";

    }


    if (
        error.name ===
        "NotFoundError"
    ) {

        return "No camera found.";

    }


    if (
        error.name ===
        "NotReadableError"
    ) {

        return "Camera is being used by another app.";

    }


    if (
        error.name ===
        "SecurityError"
    ) {

        return "Camera requires HTTPS.";

    }


    return "Unable to open camera.";

}



/* =========================================================
   14. PROCESS CAMERA
========================================================= */


async function processCameraFrame(
    timestamp
) {

    if (
        !cameraRunning ||
        !video.videoWidth ||
        !video.videoHeight
    ) {

        if (cameraRunning) {

            requestAnimationFrame(
                processCameraFrame
            );

        }

        return;

    }


    /*
        Limit MediaPipe processing.

        This makes mobile smoother.
    */

    if (
        timestamp - lastPoseTime >=
        POSE_INTERVAL
    ) {

        lastPoseTime =
            timestamp;


        if (!processingPose) {

            processingPose = true;


            try {

                await pose.send({

                    image: video

                });

            }

            catch(error) {

                console.error(
                    "Pose Error:",
                    error
                );

            }


            processingPose = false;

        }

    }


    if (cameraRunning) {

        requestAnimationFrame(
            processCameraFrame
        );

    }

}



/* =========================================================
   15. SWITCH CAMERA
========================================================= */


async function switchCamera() {

    facingMode =
        facingMode === "user"
            ? "environment"
            : "user";


    await startCamera();

}



/* =========================================================
   16. MATH
========================================================= */


function distance(a, b) {

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}



function midpoint(a, b) {

    return {

        x:
            (a.x + b.x) / 2,

        y:
            (a.y + b.y) / 2

    };

}



function clamp(
    value,
    min,
    max
) {

    return Math.max(

        min,

        Math.min(
            max,
            value
        )

    );

}



/* =========================================================
   17. LANDMARK -> STAGE
=========================================================

   IMPORTANT:

   MediaPipe coordinates are based on
   the actual video.

   We convert them to the displayed
   stage coordinates.

========================================================= */


function landmarkToStage(
    landmark
) {

    const stageWidth =
        stage.clientWidth;


    const stageHeight =
        stage.clientHeight;


    /*
        For front camera the preview
        is mirrored.

        Therefore X must also be mirrored.
    */

    let x;


    if (
        facingMode === "user"
    ) {

        x =
            (1 - landmark.x)
            *
            stageWidth;

    }
    else {

        x =
            landmark.x
            *
            stageWidth;

    }


    const y =
        landmark.y *
        stageHeight;


    return {
        x,
        y
    };

}



/* =========================================================
   18. HANDLE POSE RESULTS
========================================================= */


function handlePoseResults(
    results
) {


    /*
        No person.
    */

    if (
        !results.poseLandmarks ||
        !video.videoWidth
    ) {

        hideGarments();


        showHint(
            "Stand in front of the camera"
        );


        return;

    }


    const landmarks =
        results.poseLandmarks;



    /* =====================================================
       LANDMARKS
    ======================================================

       11 = Left Shoulder
       12 = Right Shoulder

       23 = Left Hip
       24 = Right Hip

       25 = Left Knee
       26 = Right Knee

       27 = Left Ankle
       28 = Right Ankle

    ====================================================== */


    const leftShoulder =
        landmarks[11];


    const rightShoulder =
        landmarks[12];


    const leftHip =
        landmarks[23];


    const rightHip =
        landmarks[24];


    const leftKnee =
        landmarks[25];


    const rightKnee =
        landmarks[26];


    const leftAnkle =
        landmarks[27];


    const rightAnkle =
        landmarks[28];



    /* =====================================================
       SHOULDERS REQUIRED
    ====================================================== */


    if (
        !leftShoulder ||
        !rightShoulder
    ) {

        hideGarments();


        showHint(
            "Show your shoulders"
        );


        return;

    }


    const shoulderVisibility =

        (leftShoulder.visibility || 0)

        +

        (rightShoulder.visibility || 0);



    if (
        shoulderVisibility < 0.7
    ) {

        hideGarments();


        showHint(
            "Move into the frame"
        );


        return;

    }



    /* =====================================================
       STAGE
    ====================================================== */


    const stageWidth =
        stage.clientWidth;


    const stageHeight =
        stage.clientHeight;



    /* =====================================================
       BODY POINTS
    ====================================================== */


    const shoulderL =
        landmarkToStage(
            leftShoulder
        );


    const shoulderR =
        landmarkToStage(
            rightShoulder
        );


    const shoulderMid =
        midpoint(
            shoulderL,
            shoulderR
        );


    const shoulderWidth =
        distance(
            shoulderL,
            shoulderR
        );



    /* =====================================================
       HIPS
    ====================================================== */


    let hipMid = null;

    let hipWidth = 0;


    if (

        leftHip &&

        rightHip &&

        (leftHip.visibility || 0) > 0.20 &&

        (rightHip.visibility || 0) > 0.20

    ) {

        const hipL =
            landmarkToStage(
                leftHip
            );


        const hipR =
            landmarkToStage(
                rightHip
            );


        hipMid =
            midpoint(
                hipL,
                hipR
            );


        hipWidth =
            distance(
                hipL,
                hipR
            );

    }



    /* =====================================================
       KNEES

       Knees are intentionally preferred
       over ankles.

       This means user doesn't have to
       stand extremely far away.
    ====================================================== */


    let kneeMid = null;

    let hasKnees = false;


    if (

        leftKnee &&

        rightKnee &&

        (leftKnee.visibility || 0) > 0.15 &&

        (rightKnee.visibility || 0) > 0.15

    ) {

        const kneeL =
            landmarkToStage(
                leftKnee
            );


        const kneeR =
            landmarkToStage(
                rightKnee
            );


        kneeMid =
            midpoint(
                kneeL,
                kneeR
            );


        hasKnees = true;

    }



    /* =====================================================
       ANKLES

       Optional only.
    ====================================================== */


    let ankleMid = null;

    let hasAnkles = false;


    if (

        leftAnkle &&

        rightAnkle &&

        (leftAnkle.visibility || 0) > 0.20 &&

        (rightAnkle.visibility || 0) > 0.20

    ) {

        const ankleL =
            landmarkToStage(
                leftAnkle
            );


        const ankleR =
            landmarkToStage(
                rightAnkle
            );


        ankleMid =
            midpoint(
                ankleL,
                ankleR
            );


        hasAnkles = true;

    }



    /* =====================================================
       TRACKING
    ====================================================== */


    hint.classList.add(
        "hidden"
    );


    trackingStatus.textContent =
        "Tracking ✓";



    /* =====================================================
       SHIRT
    ====================================================== */


    if (

        currentTryOn.type === "shirt" ||

        currentTryOn.type === "full"

    ) {

        updateShirt(

            shoulderMid,

            shoulderWidth,

            hipMid,

            hipWidth,

            stageWidth,

            stageHeight

        );

    }

    else {

        shirtGarment.style.opacity =
            "0";

    }



    /* =====================================================
       PANTS
    ====================================================== */


    if (

        currentTryOn.type === "pant" ||

        currentTryOn.type === "full"

    ) {

        updatePant(

            hipMid,

            hipWidth,

            kneeMid,

            hasKnees,

            ankleMid,

            hasAnkles,

            stageWidth,

            stageHeight

        );

    }

    else {

        pantGarment.style.opacity =
            "0";

    }

}



/* =========================================================
   19. UPDATE SHIRT
========================================================= */


function updateShirt(

    shoulderMid,

    shoulderWidth,

    hipMid,

    hipWidth,

    stageWidth,

    stageHeight

) {


    /*
        Product-specific scale.
    */

    const scale =
        currentTryOn.shirtScale ||
        2.15;



    /*
        Main shirt width.

        Shoulder width is the main
        body measurement.

        Hip width is also considered
        so larger bodies don't get
        an unnecessarily narrow shirt.
    */

    let widthFromShoulders =
        shoulderWidth * scale;


    let widthFromHips = 0;


    if (
        hipWidth > 0
    ) {

        widthFromHips =
            hipWidth *
            (scale * 0.95);

    }


    let widthPx =
        Math.max(
            widthFromShoulders,
            widthFromHips
        );



    /*
        Keep inside screen.
    */

    widthPx =
        clamp(

            widthPx,

            100,

            stageWidth * 0.94

        );



    /*
        Center X.
    */

    const centerX =
        shoulderMid.x;



    /*
        Shoulder Y.
    */

    const shoulderY =
        shoulderMid.y;



    /*
        Shirt top.

        Move slightly upward
        from shoulders.
    */

    const top =
        shoulderY -
        widthPx * 0.20;



    /*
        Apply.
    */

    shirtGarment.style.left =
        `${centerX}px`;


    shirtGarment.style.top =
        `${top}px`;


    shirtGarment.style.width =
        `${widthPx}px`;


    shirtGarment.style.height =
        "auto";


    shirtGarment.style.opacity =
        "0.96";


    shirtGarment.style.transform =
        "translateX(-50%)";

}



/* =========================================================
   20. UPDATE PANTS
========================================================= */


function updatePant(

    hipMid,

    hipWidth,

    kneeMid,

    hasKnees,

    ankleMid,

    hasAnkles,

    stageWidth,

    stageHeight

) {


    /*
        Hips required.
    */

    if (
        !hipMid ||
        hipWidth <= 0
    ) {

        pantGarment.style.opacity =
            "0";


        showHint(
            "Show your waist and legs"
        );


        return;

    }



    /*
        Product-specific scale.
    */

    const scale =
        currentTryOn.pantScale ||
        2.80;



    /* =====================================================
       PANT WIDTH
    ====================================================== */


    let pantWidth =
        hipWidth *
        scale;


    pantWidth =
        clamp(

            pantWidth,

            110,

            stageWidth * 0.94

        );



    /* =====================================================
       PANT HEIGHT

       IMPORTANT:

       KNEES are preferred.

       This allows closer camera distance.
    ====================================================== */


    let pantHeight = 0;



    /*
        OPTION 1:

        Hip -> Knee

        This is the preferred
        mobile measurement.
    */

    if (
        hasKnees
    ) {

        const hipY =
            hipMid.y;


        const kneeY =
            kneeMid.y;


        const upperLegLength =
            Math.abs(
                kneeY - hipY
            );


        /*
            Pants extend approximately
            twice the upper-leg distance.
        */

        pantHeight =
            upperLegLength *
            2.05;

    }



    /*
        OPTION 2:

        If knees are not visible,
        use ankles.
    */

    else if (
        hasAnkles
    ) {

        const hipY =
            hipMid.y;


        const ankleY =
            ankleMid.y;


        const legLength =
            Math.abs(
                ankleY - hipY
            );


        pantHeight =
            legLength *
            1.05;

    }



    /*
        OPTION 3:

        Fallback.
    */

    else {

        pantHeight =
            pantWidth *
            1.55;

    }



    /*
        Minimum / maximum.
    */

    pantHeight =
        clamp(

            pantHeight,

            170,

            stageHeight * 0.94

        );



    /* =====================================================
       POSITION
    ====================================================== */


    const centerX =
        hipMid.x;


    const hipY =
        hipMid.y;



    /*
        Waistband slightly above hip.
    */

    const top =
        hipY -
        pantHeight * 0.06;



    /* =====================================================
       APPLY
    ====================================================== */


    pantGarment.style.left =
        `${centerX}px`;


    pantGarment.style.top =
        `${top}px`;


    pantGarment.style.width =
        `${pantWidth}px`;


    pantGarment.style.height =
        `${pantHeight}px`;


    pantGarment.style.opacity =
        "0.96";


    pantGarment.style.transform =
        "translateX(-50%)";

}



/* =========================================================
   21. SHOW HINT
========================================================= */


function showHint(message) {

    hint.classList.remove(
        "hidden"
    );


    hint.textContent =
        message;


    trackingStatus.textContent =
        "Looking for you...";

}



/* =========================================================
   22. BUTTONS
========================================================= */


closeButton.addEventListener(
    "click",
    closeTryOn
);


backButton.addEventListener(
    "click",
    closeTryOn
);


switchCameraButton.addEventListener(
    "click",
    switchCamera
);



/* =========================================================
   23. ESCAPE
========================================================= */


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeTryOn();

        }

    }
);



/* =========================================================
   24. MODAL BACKGROUND CLICK
========================================================= */


modal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === modal
        ) {

            closeTryOn();

        }

    }
);



/* =========================================================
   25. PAGE VISIBILITY
=========================================================

   Stop processing when user leaves
   the tab/app.

========================================================= */


document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden
        ) {

            if (
                cameraRunning
            ) {

                stopCamera();

            }

        }

    }
);



/* =========================================================
   26. INITIALIZE
========================================================= */


renderProducts();

</script>
